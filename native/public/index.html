<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e8e6df" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#24292c" media="(prefers-color-scheme: dark)">
<title>locusrifle</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/theme.css" id="tui-theme">
<link rel="stylesheet" href="/css/guey.css">
<link rel="stylesheet" href="/css/garden.css">
<link rel="stylesheet" href="/css/pi-theme.css">
<link rel="stylesheet" href="/css/entry-terminal.css">
<link rel="stylesheet" href="/css/locusrifle.css">
<link rel="stylesheet" href="/css/desk.css">
</head>
<body class="locusrifle guey-tui" data-seat="operator">

<div id="locus-world" aria-label="canvas"></div>
<button type="button" id="harness-reach" aria-label="Open the pi harness"></button>

<section id="terminal-entry" class="harness" aria-label="pi harness">
	<figure id="entry-terminal">
		<div class="entry-screen">
			<div id="entry-output" aria-live="polite"></div>
			<div id="entry-widgets" class="entry-widgets" hidden></div>
			<div id="entry-pending" class="entry-pending" hidden></div>
			<div id="entry-input-zone">
				<span class="entry-model-line"><button type="button" id="entry-pi-label" title="pick the model">pi</button><span id="entry-thinking"></span></span>
				<span class="entry-input-stack"><span class="entry-prompt" aria-hidden="true">&rsaquo;</span><textarea id="entry-input" rows="1" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ask pi" aria-label="Prompt pi"></textarea><label class="entry-attach" title="attach files"><input id="entry-files" type="file" multiple accept="image/*,.txt,.md,.json,.csv,.pdf,text/plain"><span aria-hidden="true">+</span></label></span>
			</div>
			<section id="entry-dialog" hidden></section>
			<div id="slash-menu" hidden></div>
			<div class="entry-status">
				<div class="entry-status-line">
					<span id="entry-spend">$0.000</span>
					<span id="entry-source"></span>
					<span id="entry-session-name"></span>
					<span id="entry-cwd"></span>
					<span id="entry-context"></span>
					<span id="entry-model-status">stopped</span>
				</div>
			</div>
		</div>
		<i class="drop-handle" aria-hidden="true"></i>
	</figure>
</section>

<script type="module" src="/js/site.js"></script>
</body>
</html>
